{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;" class="form-card">
  <h2 style="text-align: center; color: #0f172a; margin-bottom: 1.5rem;">LOGIN TO CAMPUSFIX</h2>

  {% if error %}
  <div style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 0.8rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;">
    {{ error }}
  </div>
  {% endif %}

  <form action="{{ url_for('login') }}" method="POST">
    <div class="form-group" style="margin-bottom: 1rem;">
      <label>Username</label>
      <input type="text" name="username" class="form-control" placeholder="Enter username" required>
    </div>

    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label>Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password" required>
    </div>

    <button type="submit" class="btn-submit" style="width: 100%;">Sign In</button>
  </form>

  <div style="margin-top: 1.5rem; font-size: 0.75rem; color: #64748b; text-align: center; border-top: 1px solid #cbd5e1; padding-top: 1rem;">
    <strong>Demo Credentials:</strong><br>
    Admin: <code>admin</code> / <code>admin123</code><br>
    Student: <code>student</code> / <code>student123</code>
  </div>
</div>
{% endblock %}
