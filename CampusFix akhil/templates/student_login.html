{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;" class="form-card">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <span style="background: rgba(59, 130, 246, 0.15); color: #2563eb; padding: 0.3rem 0.8rem; border-radius: 9999px; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.05em;">STUDENT PORTAL</span>
    <h2 style="color: #0f172a; margin-top: 0.75rem; font-size: 1.5rem;">Student Sign In</h2>
  </div>

  {% if error %}
  <div style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 0.8rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;">
    {{ error }}
  </div>
  {% endif %}

  <form action="{{ url_for('student_login') }}" method="POST">
    <div class="form-group" style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #475569; margin-bottom: 0.3rem;">STUDENT USERNAME</label>
      <input type="text" name="username" class="form-control" placeholder="Enter student username" required style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px;">
    </div>

    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #475569; margin-bottom: 0.3rem;">PASSWORD</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password" required style="width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px;">
    </div>

    <button type="submit" class="btn-submit" style="width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Login as Student</button>
  </form>

  <div style="margin-top: 1.5rem; font-size: 0.75rem; color: #64748b; text-align: center; border-top: 1px solid #cbd5e1; padding-top: 1rem;">
    <strong>Demo Credentials:</strong> <code>student</code> / <code>student123</code>
  </div>
</div>
{% endblock %}
